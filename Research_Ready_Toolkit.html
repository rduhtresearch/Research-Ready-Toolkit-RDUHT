<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Back on Track Toolkit</title>
    <style>
      /* A working document: one reading column, a quiet path record, shared controls. */
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-muted: #f5f7f5;
        --border: #d9dfda;
        --border-strong: #8b978f;
        --text: #202923;
        --text-muted: #536159;
        --accent: #345c46;
        --accent-strong: #244332;
        --accent-soft: #edf3ee;
        --warning: #7a3d16;
        --warning-bg: #fff5ec;
        --max-width: 1120px;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { color-scheme: light; scrollbar-color: var(--border-strong) var(--surface-muted); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.6;
      }
      ::selection { background: #d7e7db; color: var(--text); }
      button, input, textarea, select { font: inherit; accent-color: var(--accent); caret-color: var(--accent); }
      button, a, summary { -webkit-tap-highlight-color: transparent; }
      a { color: var(--accent); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
      a:hover { color: var(--accent-strong); text-decoration-thickness: 2px; }
      :where(button, a, summary):focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      [hidden] { display: none !important; }
      p { margin: 0; }
      .page-shell { width: min(calc(100% - 4rem), var(--max-width)); margin: 0 auto; padding-bottom: 3rem; }

      /* The same compact header is present on every screen. */
      .masthead { background: var(--surface); border-bottom: 1px solid var(--border); }
      .masthead-bar { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .masthead h1 { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 1.35; letter-spacing: -0.015em; }
      .masthead-actions { display: flex; align-items: center; gap: 1rem; }
      .home-link-button { display: inline-flex; gap: 0.5rem; align-items: center; justify-content: center; min-height: 44px; padding: 0 0.25rem; border: 0; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.875rem; }
      .home-link-button:hover { color: var(--accent); }
      .home-link-button svg { width: 18px; height: 18px; }
      body[data-home-screen="true"] .masthead-actions { display: none; }

      /* Flat content and path columns; no enclosing cards or decorative panels. */
      .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; gap: 3rem; margin-top: 2.5rem; }
      .decision-stage { min-width: 0; }
      .screen-shell { display: flex; flex-direction: column; gap: 1.25rem; }
      .screen-card, .screen-main, .screen-content-stack { min-width: 0; }
      .screen-meta { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 0.5rem; color: var(--text-muted); font-size: 0.875rem; }
      .meta-pill + .meta-pill::before { content: "·"; padding-right: 0.5rem; }
      .screen-question { max-width: 36ch; margin: 0; font-size: 1.875rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; text-wrap: pretty; }
      .screen-question:focus { outline: none; }
      .screen-helper, .screen-note { max-width: 70ch; margin-top: 1rem; color: var(--text-muted); }
      .screen-note { font-size: 0.9375rem; }
      .recommendation-panel { padding: 1.5rem; border: 1px solid var(--border); background: var(--surface-muted); color: var(--text); }
      .recommendation-panel .screen-question { font-size: 1.375rem; line-height: 1.5; letter-spacing: -0.01em; }
      .recommendation-panel .screen-helper, .recommendation-panel .screen-note { color: var(--text-muted); }
      .recommendation-panel.success-panel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
      .recommendation-panel.escalation-panel { border-color: var(--warning); background: var(--warning-bg); color: var(--warning); }
      .success-panel .screen-helper, .success-panel .screen-note, .escalation-panel .screen-helper, .escalation-panel .screen-note { color: inherit; }
      .recommendation-heading { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; }

      /* One control vocabulary, with neutral choices and a clear forward action. */
      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 44px;
        padding: 0.625rem 1.125rem;
        border: 1px solid var(--accent);
        border-radius: 4px;
        background: var(--accent);
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1.4;
        text-align: center;
        cursor: pointer;
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .button:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
      .button-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
      .button-secondary:hover:not(:disabled) { background: var(--surface-muted); border-color: var(--text-muted); }
      .button:disabled { color: var(--text-muted); background: var(--surface-muted); border-color: var(--border); cursor: not-allowed; }
      .option-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }
      .option-grid .button { min-width: 120px; }
      .footer-actions { display: flex; flex-wrap: wrap; gap: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 2.5rem; }
      .footer-actions .button { min-width: 44px; padding: 0.5rem 0; border-color: transparent; background: transparent; color: var(--text-muted); font-size: 0.875rem; }
      .footer-actions .button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 0.2em; }
      .footer-actions .button:last-child { margin-left: auto; }

      /* A compact answer record, separated by rules rather than stacked cards. */
      .summary-panel { position: sticky; top: 2rem; display: flex; flex-direction: column; max-height: calc(100dvh - 12rem); min-height: 300px; border-left: 1px solid var(--border); padding-left: 1.5rem; }
      .summary-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
      .summary-panel h2 { margin: 0; font-size: 1rem; font-weight: 600; }
      .summary-status-card { padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
      .summary-status-label { display: none; }
      .summary-status { color: var(--text-muted); font-size: 0.875rem; }
      .summary-metrics { margin: 0.75rem 0 0; font-size: 0.8125rem; }
      .summary-metrics > div { display: flex; justify-content: space-between; gap: 1rem; }
      .summary-metrics dt { color: var(--text-muted); }
      .summary-metrics dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
      .history-list { margin: 0; padding: 0; list-style: none; overflow-y: auto; flex: 1 1 auto; min-height: 0; scrollbar-gutter: stable; }
      .history-list li { padding: 1rem 0; border-bottom: 1px solid var(--border); }
      .history-list li:last-child { border-bottom: 0; }
      .timeline-step { display: block; margin-bottom: 0.25rem; color: var(--text-muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
      .timeline-question, .timeline-answer, .timeline-action { display: block; font-size: 0.875rem; line-height: 1.5; }
      .timeline-question { font-weight: 500; }
      .timeline-answer { margin-top: 0.375rem; font-weight: 600; }
      .timeline-action { margin-top: 0.5rem; color: var(--text-muted); }
      .empty-history { color: var(--text-muted); font-size: 0.875rem; }
      .journey-tools { display: flex; flex-wrap: wrap; flex: 0 0 auto; gap: 0.5rem; margin-top: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
      .journey-tools .button { flex: 1; min-height: 44px; padding: 0.5rem; font-size: 0.8125rem; }
      .journey-note { flex: 0 0 100%; color: var(--text-muted); font-size: 0.8125rem; line-height: 1.5; }
      #copy-status:empty, #summary-copy-status:empty { display: none; }

      /* Preparation leads, with supporting help alongside on wide screens. */
      body[data-home-screen="true"] .workspace { grid-template-columns: minmax(0, 1fr); margin-top: 3rem; }
      .home-panel { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); gap: 3rem; align-items: start; }
      body[data-home-screen="true"] .summary-panel { display: none; }
      .home-intro { display: flex; flex-direction: column; gap: 1.125rem; }
      .home-description { max-width: 70ch; color: var(--text-muted); }
      .home-intro .screen-helper { margin: 0; font-size: 0.9375rem; }
      .home-intro .option-grid { margin-top: 0.375rem; }
      .home-faq-panel { border: 1px solid var(--border); padding: 1.5rem; }
      .home-faq-title { margin: 0 0 1rem; font-size: 1rem; font-weight: 600; }
      .home-faq-item { border-bottom: 1px solid var(--border); }
      .home-faq-item:last-child { border-bottom: 0; }
      .home-faq-item summary { min-height: 48px; padding: 0.875rem 0; font-size: 0.9375rem; cursor: pointer; }
      .home-faq-answer { padding: 0 0 1rem; color: var(--text-muted); font-size: 0.9375rem; }
      .site-footer { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.8125rem; }

      /* The report keeps actions and export ahead of supporting history. */
      .summary-screen { display: flex; flex-direction: column; gap: 1.5rem; margin-top: 1rem; }
      .summary-screen-copy { max-width: 70ch; color: var(--text-muted); }
      .summary-block { padding: 1rem 0; border-top: 1px solid var(--border); }
      .summary-block h3 { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; }
      .summary-screen > .summary-block { border: 1px solid var(--border); padding: 1.5rem; background: var(--surface-muted); color: var(--text); }
      .summary-screen.summary-on_track > .summary-block { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
      .summary-screen.summary-early_exit > .summary-block { border-color: var(--warning); background: var(--warning-bg); color: var(--warning); }
      .summary-screen-list { margin: 0; padding-left: 1.25rem; }
      .summary-screen-list li + li { margin-top: 0.75rem; }
      .summary-screen .option-grid { margin: 0; }
      .summary-details { border-top: 1px solid var(--border); }
      .summary-details > summary { min-height: 48px; padding: 0.875rem 0; font-size: 0.9375rem; cursor: pointer; }
      .summary-details .summary-block { margin-top: 0.5rem; }
      .sidebar-backdrop { position: fixed; inset: 0; z-index: 19; border: 0; background: rgba(20, 35, 26, 0.3); }

      @media (min-width: 921px) {
        #history-toggle-button, #close-sidebar-button, .sidebar-backdrop { display: none !important; }
      }
      @media (max-width: 920px) {
        .home-panel { grid-template-columns: minmax(0, 1fr); gap: 2.5rem; }
        .workspace { grid-template-columns: minmax(0, 1fr); max-width: 720px; }
        .summary-panel { position: fixed; inset: 0 0 0 auto; z-index: 20; width: min(92vw, 380px); height: 100dvh; max-height: 100dvh; min-height: 0; padding: 1.5rem; border-left: 1px solid var(--border); background: var(--surface); visibility: hidden; transform: translateX(100%); }
        body[data-sidebar-open="true"] .summary-panel { visibility: visible; transform: translateX(0); }
        body[data-sidebar-open="true"] { overflow: hidden; }
        .summary-panel-header .button { flex: 0 0 auto; width: auto; }
      }
      @media (max-width: 600px) {
        .page-shell { width: calc(100% - 2.5rem); padding-bottom: 2rem; }
        .masthead-bar { min-height: 76px; flex-wrap: wrap; gap: 0.25rem 1rem; padding: 1rem 0; }
        .masthead h1 { font-size: 1.0625rem; }
        .masthead-actions { gap: 1rem; }
        .workspace, body[data-home-screen="true"] .workspace { margin-top: 2rem; }
        .screen-question { font-size: 1.75rem; }
        .recommendation-panel { padding: 1.125rem; }
        .recommendation-panel .screen-question { font-size: 1.25rem; }
        .summary-screen > .summary-block { padding: 1.125rem; }
        .summary-screen .option-grid .button { flex: 1 1 140px; }
        .home-intro .option-grid .button { flex: 1 1 140px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body data-sidebar-open="false">
    <div class="page-shell">
      <!-- Page title and controls for returning home or viewing the path taken. -->
      <header class="masthead">
        <div class="masthead-bar">
          <div class="masthead-copy">
            <h1>Back on Track Toolkit</h1>
          </div>

          <div class="masthead-actions">
            <button
              id="home-button"
              class="home-link-button"
              type="button"
              aria-label="Return to home"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M4 11.5 12 5l8 6.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M7 10.5V19h10v-8.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <span>Home</span>
            </button>
            <button
              id="history-toggle-button"
              class="button button-secondary button-compact"
              type="button"
              aria-controls="summary-panel"
              aria-expanded="false"
            >
              Path taken
            </button>
          </div>
        </div>
      </header>


      <div class="workspace">
        <!-- JavaScript renders the current question, recommendation, or summary here. -->
        <main
          id="app"
          class="card decision-stage"
          tabindex="-1"
          aria-live="polite"
        ></main>

        <!-- Journey status, recorded answers, and progress export controls. -->
        <aside
          id="summary-panel"
          class="card summary-panel"
          aria-labelledby="summary-panel-title"
        >
          <div class="summary-panel-header">
            <div>
              <h2 id="summary-panel-title">Path taken</h2>
            </div>

            <button
              id="close-sidebar-button"
              class="button button-secondary button-icon"
              type="button"
              aria-label="Close path summary"
            >
              Close
            </button>
          </div>

          <section class="summary-status-card" aria-labelledby="summary-status-title">
            <p id="summary-status-title" class="summary-status-label">Current status</p>
            <p id="summary-status" class="summary-status">
              Your answers and recommended actions will appear here as you work
              through the toolkit.
            </p>
            <dl class="summary-metrics">
              <div>
                <dt>Questions answered</dt>
                <dd id="summary-count">0</dd>
              </div>
            </dl>
          </section>

          <ol id="history-list" class="history-list"></ol>
          <div class="journey-tools" aria-label="Export your progress">
            <button id="copy-progress" class="button button-secondary" type="button" data-copy-summary>Copy summary</button>
            <button id="download-progress" class="button button-secondary" type="button">Download CSV</button>
            <p id="copy-status" class="journey-note" role="status"></p>
          </div>
        </aside>
      </div>

      <footer class="site-footer">
        <p>Developed by the <a href="https://www.royaldevon.nhs.uk/about-us/research-and-development/" target="_blank" rel="noreferrer">RDUHT R&amp;D Department</a>. 2026</p>
      </footer>
    </div>

    <!-- Backdrop closes the path summary when it is displayed as a mobile dialog. -->
    <button
      id="sidebar-backdrop"
      class="sidebar-backdrop"
      type="button"
      aria-label="Close path summary"
      hidden
    ></button>

    <script>
      // Decision-tree content: node IDs connect questions, actions, exits, and the final summary.
      window.toolkitData = {
        // Display order used for section progress labels.
        sections: [
          "Monitoring Recruitment",
          "Escalation",
          "Access to Patients",
          "Study Protocol",
          "Delivery Staff Resources",
          "Support Services",
          "Study Supplies and Equipment",
          "Training",
          "IT",
          "Communication and Awareness",
          "Patient Pathway",
          "Share and Learn"
        ],
        // Each next value and option.next value refers to another node ID below.
        nodes: {
          // Start: related screens and their branching routes.
          welcome: {
            id: "welcome",
            type: "section_start",
            layout: "home",
            section: "Start",
            title: "Back on Track Toolkit",
            text: "This toolkit helps research delivery teams work through a structured set of questions when a study is missing recruitment milestones.",
            faqs: [
              {
                question: "Who should use this toolkit?",
                answer: "Research delivery teams can use this toolkit when a study is not meeting expected recruitment milestones and a structured review is needed."
              },
              {
                question: "What does the toolkit do?",
                answer: "It guides teams through key questions across study delivery, highlights possible barriers, and records the recommended actions and pathway taken."
              },
              {
                question: "Will I get a summary at the end?",
                answer: "Yes. At the end of the journey you can review the completion summary and download the pathway taken as a CSV."
              },
              {
                question: "Who do I contact for technical support?",
                answer: "For technical support, contact tate.graham2@nhs.net."
              }
            ],
            next: "toolkit_intro",
            nextLabel: "Continue"
          },
          toolkit_intro: {
            id: "toolkit_intro",
            type: "section_start",
            section: "Start",
            title: "Back on Track Toolkit",
            text: "Use this toolkit to work through a structured set of questions when a study is missing recruitment milestones.",
            next: "start_question",
            nextLabel: "Start toolkit"
          },
          start_question: {
            id: "start_question",
            type: "question",
            section: "Start",
            title: "Starting point",
            text: "Is the study missing recruitment milestones?",
            options: [
              { label: "Yes", next: "intro_missing" },
              { label: "No", next: "on_track" }
            ]
          },
          on_track: {
            id: "on_track",
            type: "exit",
            section: "Start",
            title: "Study on track",
            text: "Great news, the study is on track. You can still use this tool to help keep the study on track while you continue to monitor study performance.",
            next: "completion_summary",
            nextLabel: "Finish",
            outcome: "on_track"
          },
          intro_missing: {
            id: "intro_missing",
            type: "action",
            section: "Start",
            title: "Toolkit overview",
            instructional: true,
            text: "Work through the sections to identify barriers affecting recruitment. You can review the recommended actions at the end.",
            next: "monitoring_tools"
          },

          // Monitoring Recruitment: related screens and their branching routes.
          monitoring_tools: {
            id: "monitoring_tools",
            type: "question",
            section: "Monitoring Recruitment",
            title: "Monitoring Recruitment",
            text: "Do you have the right tools, access and training to monitor recruitment?",
            helperText: "Use your study management system, recruitment dashboard or an up-to-date screening log. Check that your team can access the figures and understands how to use them.",
            options: [
              { label: "Yes", next: "escalation_issues" },
              { label: "No", next: "monitoring_action" }
            ]
          },
          monitoring_action: {
            id: "monitoring_action",
            type: "action",
            section: "Monitoring Recruitment",
            title: "Monitoring Recruitment",
            text: "Implement a system to monitor and track performance.",
            next: "monitoring_training_issue"
          },
          monitoring_training_issue: {
            id: "monitoring_training_issue",
            type: "question",
            section: "Monitoring Recruitment",
            title: "Monitoring Recruitment",
            text: "Is there a training issue?",
            options: [
              { label: "Yes", next: "training_gaps" },
              { label: "No", next: "escalation_issues" }
            ]
          },

          // Escalation: related screens and their branching routes.
          escalation_issues: {
            id: "escalation_issues",
            type: "question",
            section: "Escalation",
            title: "Escalation",
            text: "Do you have issues that you have been unable to resolve?",
            options: [
              { label: "Yes", next: "escalation_already" },
              { label: "No", next: "access_patients_clinical_team" }
            ]
          },
          escalation_already: {
            id: "escalation_already",
            type: "question",
            section: "Escalation",
            title: "Escalation",
            text: "Have you escalated the study?",
            options: [
              { label: "Yes", next: "escalation_barriers" },
              { label: "No", next: "escalation_action" }
            ]
          },
          escalation_action: {
            id: "escalation_action",
            type: "action",
            section: "Escalation",
            title: "Escalation",
            text: "Escalate to the appropriate people or teams. This may include the Principal Investigator, Team Lead, Research and Development (R&D), Regional Research Delivery Network (RRDN), Sponsor, or other relevant stakeholders.",
            helperText: "Use your local escalation route to agree who will coordinate the response and what happens next.",
            next: "escalation_barriers"
          },
          escalation_barriers: {
            id: "escalation_barriers",
            type: "question",
            section: "Escalation",
            title: "Escalation",
            text: "Are the barriers still impeding recruitment even after escalation?",
            options: [
              { label: "Yes", next: "escalation_exit" },
              { label: "No", next: "access_patients_clinical_team" }
            ]
          },
          escalation_exit: {
            id: "escalation_exit",
            type: "exit",
            section: "Escalation",
            title: "Escalation required",
            text: "R&D / Team Lead should inform the Chief Investigator and Sponsor that the study will not deliver to time and target at the site, and determine next steps.",
            next: "completion_summary",
            nextLabel: "View summary",
            outcome: "early_exit"
          },

          // Access to Patients: related screens and their branching routes.
          access_patients_clinical_team: {
            id: "access_patients_clinical_team",
            type: "question",
            section: "Access to Patients",
            title: "Access to Patients",
            text: "Are you struggling to get the clinical team to approach patients to initially discuss the study?",
            options: [
              { label: "Yes", next: "access_patients_action" },
              { label: "No", next: "protocol_impeding" }
            ]
          },
          access_patients_action: {
            id: "access_patients_action",
            type: "action",
            section: "Access to Patients",
            title: "Access to Patients",
            text: "Facilitate a meeting with the Principal Investigator to identify appropriate and workable solutions. If unsuccessful, escalate to the Team Lead.",
            next: "protocol_impeding"
          },

          // Study Protocol: related screens and their branching routes.
          protocol_impeding: {
            id: "protocol_impeding",
            type: "question",
            section: "Study Protocol",
            title: "Study Protocol",
            text: "Is the protocol impeding recruitment?",
            options: [
              { label: "Yes", next: "protocol_inclusion_impeding" },
              { label: "No", next: "staff_clinical_lack" }
            ]
          },
          protocol_inclusion_impeding: {
            id: "protocol_inclusion_impeding",
            type: "question",
            section: "Study Protocol",
            title: "Study Protocol",
            text: "Are the inclusion/exclusion criteria impeding recruitment?",
            options: [
              { label: "Yes", next: "protocol_discussed_with_sponsor" },
              { label: "No", next: "protocol_substantial_modification" }
            ]
          },

                typeof entry.question === "string" && typeof entry.answer === "string" &&
                typeof entry.action === "string" && !!nodes[entry.resultingNodeId];
            }) && ["in_progress", "early_exit", "on_track", "completed"].indexOf(value.outcome) !== -1;
        }

        function saveDraft() {
          if (state.currentNodeId === "welcome") { return; }
          try {
            localStorage.setItem(draftKey, JSON.stringify({
              version: 1, state: captureSnapshot(), history: state.history
            }));
            storageAvailable = true;
          } catch (error) {
            storageAvailable = false;
          }
        }

        function resumeDraft() {
          if (!pendingDraft) { return; }
          restoreSnapshot(pendingDraft.state);
          state.history = pendingDraft.history;
          pendingDraft = null;
          render();
        }

        // Cache the static page controls used when rendering and opening the sidebar.
        var appRoot = document.getElementById("app");
        var historyList = document.getElementById("history-list");
        var summaryStatus = document.getElementById("summary-status");
        var summaryCount = document.getElementById("summary-count");
        var homeButton = document.getElementById("home-button");
        var historyToggleButton = document.getElementById("history-toggle-button");
        var closeSidebarButton = document.getElementById("close-sidebar-button");
        var sidebarBackdrop = document.getElementById("sidebar-backdrop");

        function getNode(nodeId) {
          return nodes[nodeId];
        }

        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        // Use the configured section order to describe progress through the toolkit.
        function getProgressLabel(sectionName) {
          var index = orderedSections.indexOf(sectionName);

          if (index === -1) {
            return sectionName;
          }

          return "Section " + (index + 1) + " of " + orderedSections.length;
        }

        // Translate the journey outcome into text shared by the sidebar and exports.
        function getOutcomeLabel() {
          if (state.outcome === "early_exit") {
            return "This journey ended early because escalation or further action was required.";
          }

          if (state.outcome === "on_track") {
            return "This journey finished at the on-track check.";
          }

          if (state.outcome === "completed") {
            return "This review reached the end of its pathway.";
          }

          return "Toolkit in progress.";
        }

        // Save independent copies of journey data so Back can restore the previous screen.
        function captureSnapshot() {
          return {
            currentNodeId: state.currentNodeId,
            answers: clone(state.answers),
            log: clone(state.log),
            outcome: state.outcome
          };
        }

        function restoreSnapshot(snapshot) {
          state.currentNodeId = snapshot.currentNodeId;
          state.answers = clone(snapshot.answers);
          state.log = clone(snapshot.log);
          state.outcome = snapshot.outcome;
        }

        // Attach a recommended action when an answer leads directly to an action or exit.
        function getNextNodeSummary(nextId) {
          var nextNode = getNode(nextId);

          if (!nextNode) {
            return {
              resultingNodeId: nextId,
              resultingAction: ""
            };
          }

          return {
            resultingNodeId: nextNode.id,
            resultingAction:
              !nextNode.instructional && (nextNode.type === "action" || nextNode.type === "exit") ? nextNode.text : ""
          };
        }

        // Record the answer and its next step for the timeline, completion report, and exports.
        function recordAnswer(node, option) {
          var nextSummary = getNextNodeSummary(option.next);

          state.answers[node.id] = option.label;
          state.log.push({
            stepNumber: state.log.length + 1,
            section: node.section,
            question: node.text,
            answer: option.label,
            action: nextSummary.resultingAction,
            resultingNodeId: nextSummary.resultingNodeId
          });
        }

        // Keep early exits and on-track results when entering the completion summary.
        function updateOutcomeFromNode(nextNode) {
          if (!nextNode) {
            return;
          }

          if (nextNode.type === "exit") {
            state.outcome = nextNode.outcome || "early_exit";
            return;
          }

          if (nextNode.id === "completion_summary" && state.outcome === "in_progress") {
            state.outcome = "completed";
          }
        }

        // Synchronize home/mobile layout, dialog semantics, and background interaction.
        function syncShellState() {
          var currentNode = getNode(state.currentNodeId);
          var isHomeScreen = !!(currentNode && currentNode.layout === "home");

          document.body.setAttribute("data-sidebar-open", state.sidebarOpen ? "true" : "false");
          document.body.setAttribute("data-home-screen", isHomeScreen ? "true" : "false");
          historyToggleButton.setAttribute("aria-expanded", state.sidebarOpen ? "true" : "false");
          sidebarBackdrop.hidden = !state.sidebarOpen;
          var panel = document.getElementById("summary-panel");
          var isMobile = window.matchMedia("(max-width: 920px)").matches;
          var modal = isMobile && state.sidebarOpen;
          panel.setAttribute("role", modal ? "dialog" : "complementary");
          if (modal) {
            panel.setAttribute("aria-modal", "true");
          } else {
            panel.removeAttribute("aria-modal");
          }
          appRoot.inert = modal;
          homeButton.inert = modal;
        }

        function syncScrollState() {
          document.body.setAttribute("data-scrolled", window.scrollY > 12 ? "true" : "false");
        }

        // Open the path summary and move keyboard focus to its close control.
        function openSidebar() {
          state.sidebarOpen = true;
          syncShellState();
          closeSidebarButton.focus();
        }

        // Close the path summary and return focus to its toggle if it was open.
        function closeSidebar() {
          var wasOpen = state.sidebarOpen;
          state.sidebarOpen = false;
          syncShellState();
          if (wasOpen) {
            historyToggleButton.focus();
          }
        }

        // Save the current journey before applying an answer and rendering the next node.
        function navigate(nextId, onNavigate) {
          var nextNode = getNode(nextId);

          if (!nextNode) {
            return;
          }

          state.history.push(captureSnapshot());

          if (typeof onNavigate === "function") {
            onNavigate(nextNode);
          }

          updateOutcomeFromNode(nextNode);
          state.currentNodeId = nextId;
          closeSidebar();
          render();
        }

        // Restore the last saved journey, including its answers, log, and outcome.
        function goBack() {
          if (!state.history.length) {
            return;
          }

          restoreSnapshot(state.history.pop());
          closeSidebar();
          render();
        }

        // Confirm before clearing recorded answers, then return to the welcome screen.
        function restart() {
          if (
            (state.log.length || pendingDraft) &&
            !window.confirm(
              "Start a new review? Your current answers will be cleared. Download your progress first if you need a copy."
            )
          ) {
            return;
          }
          try { localStorage.removeItem(draftKey); } catch (error) {}
          pendingDraft = null;
          state.currentNodeId = "welcome";
          state.history = [];
          state.answers = {};
          state.log = [];
          state.outcome = "in_progress";
          closeSidebar();
          render();
        }

        // Build the plain-text journey report used by clipboard export.
        function buildSummaryText() {
          var node = getNode(state.currentNodeId);
          var lines = [
            "Back on Track Toolkit summary",
            "",
            "Outcome: " + getOutcomeLabel(),
            "Current screen: " + (node ? node.title : "Unknown"),
            "Questions answered: " + state.log.length
          ];
          var sectionsVisited = [];
          var actions = [];

          state.log.forEach(function (entry) {
            if (sectionsVisited.indexOf(entry.section) === -1) {
              sectionsVisited.push(entry.section);
            }

            if (entry.action) {
              actions.push("- " + entry.action);
            }
          });

          lines.push("");
          lines.push("Sections visited: " + (sectionsVisited.join(", ") || "None"));
          lines.push("");
          if (actions.length) {
            lines.push("Recommended actions");
            Array.prototype.push.apply(lines, actions.filter(function (item, index) { return actions.indexOf(item) === index; }));
            lines.push("");
          }
          lines.push("Journey");

          if (!state.log.length) {
            lines.push("No questions answered yet.");
          }

          state.log.forEach(function (entry) {
            lines.push("");
            lines.push(entry.stepNumber + ". [" + entry.section + "] " + entry.question);
            lines.push("   Answer: " + entry.answer);

            if (entry.action) {
              lines.push("   Recommended action: " + entry.action);
            }

            lines.push("   Next step: " + entry.resultingNodeId);
          });

          return lines.join("\n");
        }

        function updateCopyButtonLabel(label) {
          var summaryFeedback = document.getElementById("summary-copy-status");
          if (summaryFeedback) { summaryFeedback.textContent = label === "Copied" ? "Summary copied to clipboard." : label; }
          document.getElementById("copy-status").textContent = label === "Copied"
            ? "Summary copied to clipboard."
            : label;
        }

        // Copy the report with the Clipboard API, falling back to a temporary textarea.
        function copySummary() {
          var summaryText = buildSummaryText();

          function fallbackCopy() {
            var textarea = document.createElement("textarea");
            textarea.value = summaryText;
            textarea.setAttribute("readonly", "readonly");
            textarea.style.position = "absolute";
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.select();

            try {
              if (document.execCommand("copy")) {
                updateCopyButtonLabel("Copied");
              } else {
                updateCopyButtonLabel("Copy unavailable. Download a CSV instead.");
              }
            } catch (error) {
              updateCopyButtonLabel("Copy unavailable. Download a CSV instead.");
            }

            document.body.removeChild(textarea);
          }

          if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
            fallbackCopy();
            return;
          }

          navigator.clipboard
            .writeText(summaryText)
            .then(function () {
              updateCopyButtonLabel("Copied");
            })
            .catch(function () {
              fallbackCopy();
            });
        }

        // Map recorded answers to the column names used by the CSV download.
        function buildExportRows() {
          return state.log.map(function (entry, index) {
            return {
              step_number: index + 1,
              section: entry.section,
              question: entry.question,
              answer: entry.answer,
              recommended_action: entry.action,
              resulting_node: entry.resultingNodeId,
              outcome: state.outcome
            };
          });
        }

        // Quote CSV fields containing commas, quotes, or line breaks, and double quotes inside.
        function escapeCsvValue(value) {
          var stringValue = String(value == null ? "" : value);

          if (/[",\n]/.test(stringValue)) {
            return '"' + stringValue.replace(/"/g, '""') + '"';
          }

          return stringValue;
        }

        // Create a CSV download and release its temporary object URL afterward.
        function downloadCsv() {
          var rows = buildExportRows();
          var headers = [
            "step_number",
            "section",
            "question",
            "answer",
            "recommended_action",
            "resulting_node",
            "outcome"
          ];
          var csvLines = [headers.join(",")];

          if (!rows.length) {
            csvLines.push(
              ["", "", "No questions answered yet", "", "", state.currentNodeId, state.outcome]
                .map(escapeCsvValue)
                .join(",")
            );
          } else {
            rows.forEach(function (row) {
              csvLines.push(
                headers.map(function (header) {
                  return escapeCsvValue(row[header]);
                }).join(",")
              );
            });
          }

          var blob = new Blob([csvLines.join("\n")], {
            type: "text/csv;charset=utf-8;"
          });
          var link = document.createElement("a");
          var url = window.URL.createObjectURL(blob);

          link.href = url;
          link.download = "back-on-track-toolkit-summary.csv";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.URL.revokeObjectURL(url);
        }

        // Create a shared button with its label, enabled state, appearance, and click handler.
        function createButton(config) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = config.secondary
            ? "button button-secondary"
            : "button";
          button.textContent = config.label;
          button.disabled = !!config.disabled;
          button.addEventListener("click", config.onClick);
          return button;
        }

        // Render answer choices and record the selected answer during navigation.
        function renderQuestion(node, container) {
          var optionGrid = document.createElement("div");
          optionGrid.className = "option-grid";

          node.options.forEach(function (option) {
            optionGrid.appendChild(
              createButton({
                label: option.label,
                secondary: true,
                onClick: function () {
                  navigate(option.next, function () {
                    recordAnswer(node, option);
                  });
                }
              })
            );
          });

          container.appendChild(optionGrid);
        }

        // Render the continue control for introduction, action, and exit screens.
        function renderActionLikeNode(node, container) {
          var actions = document.createElement("div");
          actions.className = "option-grid";

          actions.appendChild(
            createButton({
              label: node.nextLabel || "Continue",
              onClick: function () {
                if (node.type === "exit") {
                  state.outcome = node.outcome || "early_exit";
                }

                navigate(node.next);
              }
            })
          );

          container.appendChild(actions);
        }

        function createSummaryBlock(title, items, emptyMessage) {
          var block = document.createElement("section");
          block.className = "summary-block";
          var heading = document.createElement("h3");
          heading.textContent = title;
          block.appendChild(heading);

          var list = document.createElement("ul");
          list.className = "summary-screen-list";

          (items.length ? items : [emptyMessage]).forEach(function (item) {
            var li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          });

          block.appendChild(list);
          return block;
        }

        // Build the completion report from sections, questions, and actions in the journey log.
        function renderSummaryNode(node, container) {
          var summaryScreen = document.createElement("div");
          summaryScreen.className = "summary-screen summary-" + state.outcome;

          var text = document.createElement("p");
          text.className = "summary-screen-copy";
          text.textContent = state.outcome === "early_exit"
            ? "This review stopped early because escalation or further action is needed. The remaining sections have not been completed. Agree next steps with the people named in the recommendation below."
            : state.outcome === "on_track"
              ? "Your answer indicates that the study is meeting recruitment milestones. Continue monitoring performance and return to the toolkit if barriers arise. The remaining sections were not reviewed."
              : "You have reached the end of the toolkit. Review the actions below with your team. Escalate any areas not covered to your Team Lead.";
          summaryScreen.appendChild(text);

          var uniqueSections = [];
          var questionItems = [];
          var actionItems = [];

          state.log.forEach(function (entry) {
            if (uniqueSections.indexOf(entry.section) === -1) {
              uniqueSections.push(entry.section);
            }

            questionItems.push(entry.question + " Answer: " + entry.answer);

            if (entry.action) {
              actionItems.push(entry.action);
            }
          });

          summaryScreen.appendChild(createSummaryBlock(
            state.outcome === "early_exit" ? "Further action required" : "Recommended actions", actionItems.filter(function (item, index) {
              return actionItems.indexOf(item) === index;
            }), "No specific actions were triggered. Continue monitoring recruitment performance."
          ));

          var exports = document.createElement("div");
          exports.className = "option-grid";
          exports.appendChild(createButton({ label: "Copy summary", onClick: copySummary }));
          exports.appendChild(createButton({ label: "Download CSV", secondary: true, onClick: downloadCsv }));
          summaryScreen.appendChild(exports);
          var copyFeedback = document.createElement("p");
          copyFeedback.id = "summary-copy-status";
          copyFeedback.className = "journey-note";
          copyFeedback.setAttribute("role", "status");
          summaryScreen.appendChild(copyFeedback);

          var details = document.createElement("details");
          details.className = "summary-details";
          var detailTitle = document.createElement("summary");
          detailTitle.textContent = "View answer history (" + state.log.length + " answers)";
          details.appendChild(detailTitle);
          details.appendChild(createSummaryBlock("Sections visited", uniqueSections, "No sections visited."));
          details.appendChild(createSummaryBlock("Questions answered", questionItems, "No questions answered."));
          summaryScreen.appendChild(details);
          container.appendChild(summaryScreen);
        }

        // Review navigation; the shared attribution is outside the rendered screen.
        function renderNavigation(node, container) {
          if (node.layout === "home") { return; }

          var footer = document.createElement("div");
          footer.className = "footer-actions";

          footer.appendChild(
            createButton({
              label: "Start over",
              secondary: true,
              onClick: restart
            })
          );

          if (state.history.length) {
            var backButton = createButton({ label: "Back", secondary: true, onClick: goBack });
            footer.insertBefore(backButton, footer.firstChild);
          }

          container.appendChild(footer);
        }

        // Rebuild the path timeline and its current status from the recorded answers.
        function renderHistoryPanel() {
          historyList.innerHTML = "";
          summaryCount.textContent = String(state.log.length);

          if (!state.log.length) {
            var empty = document.createElement("li");
            empty.className = "empty-history";
            empty.textContent = "No answers recorded yet.";
            historyList.appendChild(empty);
            summaryStatus.textContent = "Toolkit in progress.";
            return;
          }

          state.log.forEach(function (entry) {
            var item = document.createElement("li");
            var step = document.createElement("span");
            step.className = "timeline-step";
            step.textContent = "Step " + entry.stepNumber;

            var question = document.createElement("span");
            question.className = "timeline-question";
            question.textContent = "[" + entry.section + "] " + entry.question;

            var answer = document.createElement("span");
            answer.className = "timeline-answer";
            answer.textContent = "Answer: " + entry.answer;

            item.appendChild(step);
            item.appendChild(question);
            item.appendChild(answer);

            if (entry.action) {
              var action = document.createElement("span");
              action.className = "timeline-action";
              action.textContent = "Recommended action: " + entry.action;
              item.appendChild(action);
            }

            historyList.appendChild(item);
          });

          summaryStatus.textContent = getOutcomeLabel();
        }

        // Reserve positive colour for a confirmed on-track outcome, never mere progress.
        function getContentPanelClass(node) {
          if (node.instructional || (node.type !== "action" && node.type !== "exit")) {
            return "question-panel";
          }
          if (node.type === "exit") {
            return node.outcome === "on_track"
              ? "recommendation-panel success-panel"
              : "recommendation-panel escalation-panel";
          }
          return "recommendation-panel";
        }

        // Render the current node, refresh the sidebar, and focus the new screen heading.
        function render() {
          var node = getNode(state.currentNodeId);

          if (!node) {
            return;
          }

          appRoot.innerHTML = "";

          var shell = document.createElement("div");
          shell.className = "screen-shell";

          if (node.layout !== "home") {
            var meta = document.createElement("div");
            meta.className = "screen-meta";
            var progressLabel = getProgressLabel(node.section);

            if (progressLabel !== node.section && node.type !== "summary") {
              var progress = document.createElement("span");
              progress.className = "meta-pill";
              progress.textContent = progressLabel;
              meta.appendChild(progress);
            }

            var section = document.createElement("span");
            section.className = "meta-pill";
            section.textContent = node.type === "summary" ? "Review summary" : node.section;
            meta.insertBefore(section, meta.firstChild);

            shell.appendChild(meta);
          }

          var screenCard = document.createElement("section");
          screenCard.className = "screen-card";

          var screenMain = document.createElement("div");
          screenMain.className = "screen-main";

          var contentStack = document.createElement("div");
          contentStack.className = "screen-content-stack";

          if (node.type === "summary") {
            var summaryLead = document.createElement("div");
            summaryLead.className = "summary-panel-block";
            var summaryQuestion = document.createElement("h2");
            summaryQuestion.className = "screen-question";
            summaryQuestion.textContent = state.outcome === "early_exit" ? "Escalation needed before continuing."
              : state.outcome === "on_track" ? "The study is currently on track."
              : "Your review is complete.";
            summaryLead.appendChild(summaryQuestion);
            contentStack.appendChild(summaryLead);
          } else if (node.layout === "home") {
            var homePanel = document.createElement("div");
            homePanel.className = "home-panel";

            var homeIntro = document.createElement("div");
            homeIntro.className = "home-intro";

            var homeQuestion = document.createElement("h2");
            homeQuestion.className = "screen-question";
            homeQuestion.textContent = "Get recruitment back on track.";
            homeIntro.appendChild(homeQuestion);

            var homeDescription = document.createElement("p");
            homeDescription.className = "home-description";
            homeDescription.textContent = node.text;
            homeIntro.appendChild(homeDescription);

            if (node.helperText) {
              var homeHelper = document.createElement("p");
              homeHelper.className = "screen-helper";
              homeHelper.textContent = node.helperText;
              homeIntro.appendChild(homeHelper);
            }

            var expectations = document.createElement("p");
            expectations.className = "home-description review-expectations";
            expectations.textContent = "Review up to 12 areas of study delivery, one question at a time. Some pathways end earlier with a recommended next step. Have your recruitment figures and screening log ready.";
            homeIntro.appendChild(expectations);
            if (pendingDraft) {
              var resumeActions = document.createElement("div");
              resumeActions.className = "option-grid";
              resumeActions.appendChild(createButton({ label: "Resume review", onClick: resumeDraft }));
              resumeActions.appendChild(createButton({ label: "Start over", secondary: true, onClick: restart }));
              homeIntro.appendChild(resumeActions);
            } else {
              renderActionLikeNode({ next: "start_question", nextLabel: "Start review" }, homeIntro);
            }

            homePanel.appendChild(homeIntro);

            if (Array.isArray(node.faqs) && node.faqs.length > 0) {
              var faqPanel = document.createElement("section");
              faqPanel.className = "home-faq-panel";
              faqPanel.setAttribute("aria-labelledby", "home-faq-title");

              var faqTitle = document.createElement("h3");
              faqTitle.className = "home-faq-title";
              faqTitle.id = "home-faq-title";
              faqTitle.textContent = "Frequently asked questions";
              faqPanel.appendChild(faqTitle);

              var faqList = document.createElement("div");
              faqList.className = "home-faq-list";

              node.faqs.forEach(function (item, index) {
                var faqItem = document.createElement("details");
                faqItem.className = "home-faq-item";

                var faqSummary = document.createElement("summary");
                faqSummary.textContent = item.question;
                faqItem.appendChild(faqSummary);

                var faqAnswer = document.createElement("p");
                faqAnswer.className = "home-faq-answer";
                faqAnswer.textContent = item.answer;
                faqItem.appendChild(faqAnswer);

                faqList.appendChild(faqItem);
              });

              faqPanel.appendChild(faqList);
              homePanel.appendChild(faqPanel);
            }

            contentStack.appendChild(homePanel);
          } else {
            var isRecommendation = !node.instructional && (node.type === "action" || node.type === "exit");
            var isPositiveExit = node.type === "exit" && node.outcome === "on_track";
            var contentPanel = document.createElement("div");
            contentPanel.className = getContentPanelClass(node);

            if (isRecommendation) {
              var recommendationHeading = document.createElement("p");
              recommendationHeading.className = "recommendation-heading";
              recommendationHeading.textContent = isPositiveExit ? "Study on track" : node.type === "exit" ? "Further action required" : "Recommended action";
              contentPanel.appendChild(recommendationHeading);
            }

            var question = document.createElement("h2");
            question.className = "screen-question";
            question.textContent = node.text;
            contentPanel.appendChild(question);

            if (node.helperText) {
              var helper = document.createElement("p");
              helper.className = "screen-helper";
              helper.textContent = node.helperText;
              contentPanel.appendChild(helper);
            }

            var terms = {
              "R&D": "Research and Development",
              "RRDN": "Regional Research Delivery Network",
              "PI": "Principal Investigator",
              "PPIE": "Patient and Public Involvement and Engagement"
            };
            var definitions = Object.keys(terms).filter(function (term) {
              return new RegExp("\\b" + term + "\\b").test(node.text) && node.text.indexOf(terms[term]) === -1;
            });
            if (definitions.length) {
              var terminology = document.createElement("p");
              terminology.className = "screen-helper";
              terminology.textContent = definitions.map(function (term) { return term + ": " + terms[term]; }).join(". ") + ".";
              contentPanel.appendChild(terminology);
            }

            if (node.type === "section_start") {
              var startNote = document.createElement("p");
              startNote.className = "screen-note";
              startNote.textContent = "Start with the first check, then move through the toolkit one screen at a time.";
              contentPanel.appendChild(startNote);
            }

            if (node.type === "action" && !node.instructional) {
              var note = document.createElement("p");
              note.className = "screen-note";
              note.textContent = "Review the action above, then continue when you are ready.";
              contentPanel.appendChild(note);
            }

            if (node.type === "exit") {
              var exitNote = document.createElement("p");
              exitNote.className = "screen-note";
              exitNote.textContent = isPositiveExit
                ? "This pathway shows the study is currently on track."
                : "This pathway needs escalation or a managed next step before the toolkit can continue.";
              contentPanel.appendChild(exitNote);
            }

            contentStack.appendChild(contentPanel);
          }

          screenMain.appendChild(contentStack);
          screenCard.appendChild(screenMain);

          if (node.type === "question") {
            renderQuestion(node, screenCard);
          } else if (node.type === "summary") {
            renderSummaryNode(node, screenCard);
          } else if (node.layout !== "home") {
            renderActionLikeNode(node, screenCard);
          }

          renderNavigation(node, screenCard);
          shell.appendChild(screenCard);
          appRoot.appendChild(shell);
          renderHistoryPanel();
          saveDraft();
          syncShellState();
          document.getElementById("copy-progress").disabled = !state.log.length;
          document.getElementById("download-progress").disabled = !state.log.length;
          document.getElementById("copy-status").textContent = "";
          var heading = appRoot.querySelector(".screen-question");
          if (heading) {
            heading.setAttribute("tabindex", "-1");
            heading.focus({ preventScroll: true });
          }
          window.scrollTo({ top: 0, behavior: "instant" });
        }

        // Wire export controls and keyboard handling for the mobile dialog focus loop.
        document.getElementById("copy-progress").addEventListener("click", copySummary);
        document.getElementById("download-progress").addEventListener("click", downloadCsv);
        document.addEventListener("keydown", function (event) {
          if (state.sidebarOpen && window.matchMedia("(max-width: 920px)").matches) {
            if (event.key === "Escape") {
              closeSidebar();
              historyToggleButton.focus();
            } else if (event.key === "Tab") {
              var panel = document.getElementById("summary-panel");
              var controls = panel.querySelectorAll("button:not(:disabled), a[href]");
              var first = controls[0];
              var last = controls[controls.length - 1];
              if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
              } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
              }
            }
          }
        });

        historyToggleButton.addEventListener("click", function () {
          if (state.sidebarOpen) {
            closeSidebar();
            return;
          }

          openSidebar();
        });
        homeButton.addEventListener("click", restart);
        closeSidebarButton.addEventListener("click", closeSidebar);
        sidebarBackdrop.addEventListener("click", closeSidebar);
        window.addEventListener("scroll", syncScrollState, { passive: true });
        window.addEventListener("resize", syncShellState);

        window.addEventListener("beforeunload", function (event) {
          if (!storageAvailable && state.currentNodeId !== "welcome") {
            event.preventDefault();
            event.returnValue = "";
          }
        });

        // Draw the initial welcome screen and synchronize the sticky header appearance.
        render();
        syncScrollState();
      })();
    </script>
  </body>
</html>
